[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-project-lab"
version = "0.2.0"
description = "Local-first CLI for turning rough project ideas into reusable AI coding agent workflows."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Agent Project Lab" }
]
license = { text = "MIT" }
keywords = ["cli", "agents", "skills", "workflow", "ai-coding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "Jinja2>=3.1.0",
  "pydantic>=2.6.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
lab = "codex_project_lab.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["codex_project_lab*"]

[tool.setuptools.package-data]
codex_project_lab = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
