name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag and package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package_version="$(PYTHONPATH=. python -c 'import agent_project_lab; print(agent_project_lab.__version__)')"
          test "$tag_version" = "$project_version"
          test "$tag_version" = "$package_version"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/agent-project-lab-wheel
          /tmp/agent-project-lab-wheel/bin/python -m pip install dist/*.whl
          /tmp/agent-project-lab-wheel/bin/lab --help

      - name: Install and smoke-test source distribution
        run: |
          python -m venv /tmp/agent-project-lab-sdist
          /tmp/agent-project-lab-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/agent-project-lab-sdist/bin/lab --help

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
